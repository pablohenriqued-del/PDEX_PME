<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050916"/>
      <stop offset="100%" stop-color="#0F1B3D"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Mark -->
  <g transform="translate(140 220)">
    <rect x="0" y="0" width="180" height="180" rx="36" fill="#0A1029" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
    <g transform="translate(90 90)" fill="url(#brand)">
      <rect x="-64" y="-15" width="128" height="30" rx="6" transform="rotate(45)"/>
      <rect x="-64" y="-15" width="128" height="30" rx="6" transform="rotate(-45)"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="380" y="360" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="200" letter-spacing="-6" fill="url(#brand)">PDEX</text>

  <!-- Tagline -->
  <text x="380" y="420" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="26" letter-spacing="8" fill="#94A3B8">PME · ERP · SEM LIMITES</text>

  <!-- Bottom hint -->
  <text x="140" y="560" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="28" fill="#CBD5E1">Gestão completa para empresas que querem ir além.</text>

  <!-- Bottom line -->
  <line x1="140" y1="580" x2="240" y2="580" stroke="url(#brand)" stroke-width="4" stroke-linecap="round"/>
</svg>
